<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Sunrise Interiors — Call Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --clay: #b5502f;
    --plaster: #f6f0e7;
    --charcoal: #2a2622;
    --stone: #6f675d;
    --line: #e0d5c4;
    --green: #5a7a4a;
    --red: #b5502f;
    --amber: #c9a35a;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--plaster);
    color: var(--charcoal);
    margin: 0;
    min-height: 100vh;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 48px 28px 80px; }
  .top {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 36px;
    flex-wrap: wrap;
    gap: 16px;
  }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--clay);
    margin-bottom: 10px;
  }
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 2rem;
    margin: 0;
  }
  .key-entry {
    display: flex;
    gap: 8px;
  }
  .key-entry input {
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.85rem;
    width: 220px;
    background: #fdfbf8;
  }
  .key-entry button {
    padding: 9px 16px;
    background: var(--charcoal);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 0.85rem;
    cursor: pointer;
    font-weight: 500;
  }
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 40px;
  }
  @media (max-width: 760px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
  }
  .stat-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--stone);
    margin-bottom: 10px;
  }
  .stat-value {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 2rem;
    color: var(--charcoal);
  }
  .section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--stone);
    margin-bottom: 14px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  th {
    text-align: left;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--stone);
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    background: #fbf7f0;
  }
  td {
    padding: 14px 16px;
    font-size: 0.88rem;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  tr:last-child td { border-bottom: none; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.78rem;
    font-weight: 500;
    padding: 3px 10px;
    border-radius: 20px;
  }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; }
  .badge.completed { background: #eaf1e6; color: var(--green); }
  .badge.failed { background: #f6e6e0; color: var(--red); }
  .badge.initiated { background: #f3ead6; color: var(--amber); }
  .phone { font-family: 'IBM Plex Mono', monospace; font-size: 0.82rem; }
  .summary { color: var(--stone); max-width: 280px; }
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--stone);
    background: #fff;
    border: 1px dashed var(--line);
    border-radius: 10px;
    font-size: 0.95rem;
  }
  .msg { color: var(--red); font-size: 0.9rem; margin-top: 8px; }
  .view-btn {
    background: none;
    border: 1px solid var(--line);
    color: var(--charcoal);
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 0.8rem;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .view-btn:hover { background: #fbf7f0; }
  .view-btn:disabled { color: var(--stone); cursor: not-allowed; opacity: 0.5; }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(42,38,34,0.45);
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 24px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: 12px;
    max-width: 640px;
    width: 100%;
    max-height: 82vh;
    overflow-y: auto;
    padding: 32px;
  }
  .modal-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 20px;
  }
  .modal h3 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 1.3rem;
    margin: 0 0 4px;
  }
  .modal .modal-sub {
    font-size: 0.85rem;
    color: var(--stone);
  }
  .modal-close {
    background: none;
    border: none;
    font-size: 1.4rem;
    cursor: pointer;
    color: var(--stone);
    line-height: 1;
    padding: 0;
  }
  .modal audio {
    width: 100%;
    margin-bottom: 20px;
  }
  .modal-section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--stone);
    margin: 18px 0 8px;
  }
  .transcript-box {
    background: #fbf7f0;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 16px;
    font-size: 0.88rem;
    line-height: 1.6;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="eyebrow">Sunrise Interiors — Ops</div>
      <h1>Call Dashboard</h1>
    </div>
    <div>
      <div class="key-entry">
        <input id="adminKey" type="password" placeholder="Admin key" />
        <button onclick="loadData()">Load</button>
      </div>
      <div id="authMsg" class="msg"></div>
    </div>
  </div>

  <div class="stats" id="statsGrid">
    <div class="stat"><div class="stat-label">Total calls</div><div class="stat-value">—</div></div>
    <div class="stat"><div class="stat-label">Completed</div><div class="stat-value">—</div></div>
    <div class="stat"><div class="stat-label">Success rate</div><div class="stat-value">—</div></div>
    <div class="stat"><div class="stat-label">Avg duration</div><div class="stat-value">—</div></div>
  </div>

  <div class="section-label">Recent calls</div>
  <div id="tableWrap">
    <div class="empty">Enter your admin key above and click Load to view call history.</div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-top">
      <div>
        <h3 id="modalName">—</h3>
        <div class="modal-sub" id="modalMeta">—</div>
      </div>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div id="modalRecordingWrap"></div>
    <div class="modal-section-label">Summary</div>
    <div class="transcript-box" id="modalSummary">—</div>
    <div class="modal-section-label">Full transcript</div>
    <div class="transcript-box" id="modalTranscript">—</div>
  </div>
</div>

<script>
let currentCalls = [];

async function loadData() {
  const key = document.getElementById('adminKey').value.trim();
  const authMsg = document.getElementById('authMsg');
  authMsg.textContent = '';

  if (!key) {
    authMsg.textContent = 'Enter an admin key first.';
    return;
  }

  try {
    const [metricsRes, callsRes] = await Promise.all([
      fetch('/metrics'),
      fetch('/api/admin/calls', { headers: { 'x-admin-key': key } })
    ]);

    if (!callsRes.ok) {
      const err = await callsRes.json();
      authMsg.textContent = err.error || 'Failed to authenticate.';
      return;
    }

    const metrics = await metricsRes.json();
    const { calls } = await callsRes.json();
    currentCalls = calls;

    renderStats(metrics);
    renderTable(calls);
  } catch (e) {
    authMsg.textContent = 'Network error — is the server running?';
  }
}

function renderStats(m) {
  const grid = document.getElementById('statsGrid');
  grid.innerHTML = `
    <div class="stat"><div class="stat-label">Total calls</div><div class="stat-value">${m.total_calls}</div></div>
    <div class="stat"><div class="stat-label">Completed</div><div class="stat-value">${m.completed_calls}</div></div>
    <div class="stat"><div class="stat-label">Success rate</div><div class="stat-value">${m.success_rate}</div></div>
    <div class="stat"><div class="stat-label">Avg duration</div><div class="stat-value">${m.avg_call_duration_seconds ? m.avg_call_duration_seconds + 's' : '—'}</div></div>
  `;
}

function renderTable(calls) {
  const wrap = document.getElementById('tableWrap');
  if (!calls || calls.length === 0) {
    wrap.innerHTML = '<div class="empty">No calls yet. Trigger one from the landing page to see it appear here.</div>';
    return;
  }

  const rows = calls.map((c, i) => {
    const statusClass = c.status === 'completed' ? 'completed' : c.status === 'failed' ? 'failed' : 'initiated';
    const dotColor = statusClass === 'completed' ? '#5a7a4a' : statusClass === 'failed' ? '#b5502f' : '#c9a35a';
    const when = new Date(c.created_at).toLocaleString();
    const hasDetail = !!(c.transcript || c.summary || c.recording_url);
    return `
      <tr>
        <td>${when}</td>
        <td class="phone">${c.phone_number}</td>
        <td><span class="badge ${statusClass}"><span class="dot" style="background:${dotColor}"></span>${c.status}</span></td>
        <td>${c.ended_reason || '—'}</td>
        <td class="summary">${c.summary || '—'}</td>
        <td>${c.duration_seconds ? c.duration_seconds + 's' : '—'}</td>
        <td><button class="view-btn" ${hasDetail ? '' : 'disabled'} onclick="openModal(${i})">${hasDetail ? 'View' : 'No data'}</button></td>
      </tr>
    `;
  }).join('');

  wrap.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Time</th>
          <th>Phone</th>
          <th>Status</th>
          <th>Ended reason</th>
          <th>Summary</th>
          <th>Duration</th>
          <th>Transcript / Recording</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function openModal(index) {
  const c = currentCalls[index];
  if (!c) return;

  document.getElementById('modalName').textContent = c.name || c.phone_number;
  document.getElementById('modalMeta').textContent =
    `${c.project_type || 'No project type noted'} · ${c.phone_number} · ${new Date(c.created_at).toLocaleString()}`;
  document.getElementById('modalSummary').textContent = c.summary || 'No summary captured for this call.';
  document.getElementById('modalTranscript').textContent = c.transcript || 'No transcript captured for this call.';

  const recordingWrap = document.getElementById('modalRecordingWrap');
  if (c.recording_url) {
    recordingWrap.innerHTML = `<audio controls src="${c.recording_url}"></audio>`;
  } else {
    recordingWrap.innerHTML = '';
  }

  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('modalRecordingWrap').innerHTML = '';
}

document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'modalOverlay') closeModal();
});
</script>
</body>
</html>
